name: three_finger_gripper

services:
  foxglove:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        ROS_DISTRO: jazzy
    image: three_finger_gripper:dev
    container_name: gripper_foxglove

    stdin_open: true
    tty: true

    network_mode: host
    ipc: host

    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    working_dir: /ws

    volumes:
      - ../..:/ws

    # asset_uri_allowlist lets the 3D panel resolve the package:// mesh paths.
    command: >
      ros2 run foxglove_bridge foxglove_bridge --ros-args
      -p port:=8765
      -p asset_uri_allowlist:=['^package://(?!.*\.\.).*']

name: three_finger_gripper

services:
  camera:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        ROS_DISTRO: jazzy
    image: three_finger_gripper:dev
    container_name: gripper_camera

    stdin_open: true
    tty: true

    network_mode: host
    # Without this the image topic appears in other containers but delivers nothing.
    ipc: host

    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    working_dir: /ws

    volumes:
      - ../..:/ws

    command: ros2 launch gripper_bringup sensors.launch.py foxglove:=false

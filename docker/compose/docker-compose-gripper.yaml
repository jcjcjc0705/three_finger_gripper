name: three_finger_gripper

services:
  gripper:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        ROS_DISTRO: jazzy
    image: three_finger_gripper:dev
    container_name: gripper_state

    stdin_open: true
    tty: true

    network_mode: host
    ipc: host

    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # For RViz, when view_robot.launch.py is run from a shell in here.
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1

    working_dir: /ws

    volumes:
      - ../..:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # /joint_states, the 3D model's /tf, and what dxl_cli and dxl_debug talk to.
    command: ros2 launch gripper_bringup board.launch.py

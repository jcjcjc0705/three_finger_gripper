# Everything at once. The services are not redefined here: they are included
# from the single-service files, so there is one definition of each and no way
# for them to drift apart.
#
# The single-service scripts work alongside this, on the same containers: one
# service can be restarted or debugged while the others keep running.
name: three_finger_gripper

include:
  - docker-compose-agent.yaml
  - docker-compose-gripper.yaml
  - docker-compose-camera.yaml
  - docker-compose-foxglovebridge.yaml
